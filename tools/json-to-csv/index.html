<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON to CSV — UWTools</title><meta name="description" content="Convert an array of JSON objects to CSV locally."><link rel="canonical" href="https://uwtools.com/tools/json-to-csv/"><link rel="stylesheet" href="/assets/style.css"><style>.tool{max-width:900px;margin:55px auto;padding:0 24px}.tool h1{font-size:40px;margin-bottom:8px}.tool>p{color:#667085}.editor{width:100%;min-height:220px;padding:16px;border:1px solid #d7dce5;border-radius:14px;font:15px/1.5 ui-monospace,monospace}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.actions button{border:0;border-radius:9px;padding:11px 15px;font-weight:650;cursor:pointer}.primary{background:#2563eb!important;color:#fff}.field{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:9px;margin:6px 0}.result{margin:15px 0;padding:17px;background:#f8fafc;border-radius:12px;word-break:break-all}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="/">UW<span>Tools</span></a><nav><a href="/">All Tools</a></nav></header><main class="tool"><h1>JSON to CSV</h1><p>Convert an array of JSON objects to CSV locally.</p><textarea id="v" class="editor" placeholder='[{"name":"Ada","age":30}]'></textarea><div class="actions"><button class="primary" onclick="go()">Convert to CSV</button></div><textarea id="out" class="editor" readonly></textarea></main><footer>© 2026 UWTools</footer><script>function go(){try{const a=JSON.parse(v.value);if(!Array.isArray(a)||!a.length)throw Error("Enter a non-empty JSON array");const k=[...new Set(a.flatMap(Object.keys))],q=x=>'"'+String(x??"").replace(/"/g,'""')+'"';out.value=k.map(q).join(",")+"\n"+a.map(o=>k.map(x=>q(o[x])).join(",")).join("\n")}catch(e){out.value=e.message}}</script></body></html>
