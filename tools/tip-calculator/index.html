<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tip Calculator Online | UWTools</title><meta name="description" content="Calculate tip amount, total bill and per-person split instantly."><link rel="canonical" href="https://uwtools.com/tools/tip-calculator/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/developer-tools/">Developer</a><a href="/image-tools/">Images</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Calculator Tools</div><h1>Tip Calculator</h1><p>Calculate a tip and split a bill between people.</p><div class="card tool-panel"><input id="bill" type="number" min="0" step="0.01" placeholder="Bill amount"><input id="tip" type="number" min="0" step="0.1" value="15" placeholder="Tip %"><input id="people" type="number" min="1" step="1" value="1" placeholder="People"><div class="tool-actions"><button id="go">Calculate Tip</button></div><pre id="out">Tip details will appear here.</pre></div></section></main><script>go.onclick=()=>{const b=+bill.value,t=+tip.value,p=Math.max(1,Math.floor(+people.value||1));if(!(b>=0&&t>=0))return out.textContent='Enter a valid bill and tip percentage.';const tipAmt=b*t/100,total=b+tipAmt;out.textContent='Tip: '+tipAmt.toFixed(2)+'\nTotal: '+total.toFixed(2)+'\nPer person: '+(total/p).toFixed(2)}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
