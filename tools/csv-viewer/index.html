<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV Viewer Online | UWTools</title><meta name="description" content="Paste CSV data and view it as a clean table locally in your browser."><link rel="canonical" href="https://uwtools.com/tools/csv-viewer/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/developer-tools/">Developer</a><a href="/image-tools/">Images</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Developer Tools</div><h1>CSV Viewer</h1><p>Preview comma-separated data as a table.</p><div class="card tool-panel"><textarea id="src" rows="10" placeholder="name,email&#10;Alex,alex@example.com"></textarea><div class="tool-actions"><button id="go">View CSV</button></div><div id="view" class="preview-box">CSV table will appear here.</div></div></section></main><script>function line(s){const a=[];let x='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){x+='"';i++}else q=!q}else if(c===','&&!q){a.push(x);x=''}else x+=c}a.push(x);return a}go.onclick=()=>{const rows=src.value.trim().split(/\r?\n/).filter(Boolean).map(line);if(!rows.length)return view.textContent='Paste CSV data first.';const table=document.createElement('table');table.className='data-table';rows.forEach((r,i)=>{const tr=document.createElement('tr');r.forEach(v=>{const el=document.createElement(i===0?'th':'td');el.textContent=v;tr.appendChild(el)});table.appendChild(tr)});view.innerHTML='';view.appendChild(table)}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
