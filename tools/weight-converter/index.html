<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weight Converter Online | UWTools</title><meta name="description" content="Convert between kilograms, grams, pounds and ounces."><link rel="canonical" href="https://uwtools.com/tools/weight-converter/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/developer-tools/">Developer</a><a href="/text-tools/">Text</a><a href="/calculator-tools/">Calculators</a><a href="/converter-tools/">Converters</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Converter Tools</div><h1>Weight Converter</h1><p>Convert common weight units instantly.</p><div class="card tool-panel"><input id="v" type="number" step="any" placeholder="Value"><select id="from"><option value="kg">Kilograms</option><option value="g">Grams</option><option value="lb">Pounds</option><option value="oz">Ounces</option></select><select id="to"><option value="lb">Pounds</option><option value="kg">Kilograms</option><option value="g">Grams</option><option value="oz">Ounces</option></select><div class="tool-actions"><button id="go">Convert</button></div><pre id="out">Converted value will appear here.</pre></div></section></main><script>const f={kg:1,g:.001,lb:.45359237,oz:.028349523125};go.onclick=()=>{const x=+v.value;if(!Number.isFinite(x))return out.textContent='Enter a number.';out.textContent=(x*f[from.value]/f[to.value]).toLocaleString(undefined,{maximumFractionDigits:8})+' '+to.value}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
