<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XML Formatter Online | UWTools</title><meta name="description" content="Format XML with readable indentation directly in your browser."><link rel="canonical" href="https://uwtools.com/tools/xml-formatter/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/developer-tools/">Developer</a><a href="/text-tools/">Text</a><a href="/calculator-tools/">Calculators</a><a href="/image-tools/">Images</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Developer Tools</div><h1>XML Formatter</h1><p>Pretty-print XML for easier reading.</p><div class="card tool-panel"><textarea id="src" rows="12" placeholder="<root><item>value</item></root>"></textarea><div class="tool-actions"><button id="go">Format XML</button></div><pre id="out">Formatted XML will appear here.</pre></div></section></main><script>function fmt(xml){const parser=new DOMParser(),doc=parser.parseFromString(xml,'application/xml');if(doc.querySelector('parsererror'))throw Error('Invalid XML');const s=new XMLSerializer().serializeToString(doc).replace(/>\s*</g,'><');let out='',pad=0;s.replace(/(<[^>]+>)/g,'$1\n').trim().split('\n').forEach(line=>{if(/^<\//.test(line))pad=Math.max(0,pad-1);out+='  '.repeat(pad)+line+'\n';if(/^<[^!?/][^>]*[^/]?>$/.test(line)&&!/<\/[^>]+>$/.test(line))pad++});return out.trim()}go.onclick=()=>{try{out.textContent=fmt(src.value)}catch(e){out.textContent='Error: '+e.message}}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
