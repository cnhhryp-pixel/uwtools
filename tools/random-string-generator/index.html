<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random String Generator | UWTools</title><meta name="description" content="Generate random alphanumeric strings locally in your browser."><link rel="canonical" href="https://uwtools.com/tools/random-string-generator/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/developer-tools/">Developer</a><a href="/image-tools/">Images</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Text Tools</div><h1>Random String Generator</h1><p>Create random strings with custom length and character sets.</p><div class="card tool-panel"><input id="len" type="number" min="1" max="1000" value="16"><label class="check"><input id="lower" type="checkbox" checked> Lowercase</label><label class="check"><input id="upper" type="checkbox" checked> Uppercase</label><label class="check"><input id="digits" type="checkbox" checked> Numbers</label><div class="tool-actions"><button id="go">Generate String</button></div><pre id="out">Random string will appear here.</pre></div></section></main><script>go.onclick=()=>{let chars='';if(lower.checked)chars+='abcdefghijklmnopqrstuvwxyz';if(upper.checked)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';if(digits.checked)chars+='0123456789';if(!chars)return out.textContent='Choose at least one character set.';const n=Math.min(1000,Math.max(1,+len.value||16)),a=new Uint32Array(n);crypto.getRandomValues(a);out.textContent=[...a].map(x=>chars[x%chars.length]).join('')}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
