<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rotate PDF Online — Rotate PDF Pages | UWTools</title><meta name="description" content="Rotate every page in a PDF by 90, 180 or 270 degrees directly in your browser."><link rel="canonical" href="https://uwtools.com/tools/pdf-rotate/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/pdf-tools/">PDF Tools</a><a href="/image-tools/">Image Tools</a><a href="/developer-tools/">Developer</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">PDF Tools</div><h1>Rotate PDF</h1><p>Rotate PDF pages locally in your browser.</p><div class="card tool-panel"><input id="file" type="file" accept="application/pdf"><select id="angle"><option value="90">90° clockwise</option><option value="180">180°</option><option value="270">270° clockwise</option></select><button id="go">Rotate & Download</button><p id="status">Choose a PDF to begin.</p></div></section><section><h2>How it works</h2><p>Select a PDF, choose the rotation angle, and download the rotated copy. Your file is processed locally.</p></section></main><script>document.getElementById('go').onclick=async()=>{const f=document.getElementById('file').files[0],s=document.getElementById('status');if(!f)return s.textContent='Choose a PDF first.';s.textContent='Rotating…';const d=await PDFLib.PDFDocument.load(await f.arrayBuffer()),a=+document.getElementById('angle').value;d.getPages().forEach(p=>p.setRotation(PDFLib.degrees((p.getRotation().angle+a)%360)));const b=await d.save(),u=URL.createObjectURL(new Blob([b],{type:'application/pdf'})),x=document.createElement('a');x.href=u;x.download='rotated.pdf';x.click();URL.revokeObjectURL(u);s.textContent='Done.'}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
