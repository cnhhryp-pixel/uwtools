<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV Column Extractor | UWTools</title><meta name="description" content="Extract one selected column from CSV data locally in your browser."><link rel="canonical" href="https://uwtools.com/tools/csv-column-extractor/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/developer-tools/">Developer</a><a href="/image-tools/">Images</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Developer Tools</div><h1>CSV Column Extractor</h1><p>Pull a single column from CSV data.</p><div class="card tool-panel"><textarea id="src" rows="10" placeholder="name,email&#10;Alex,alex@example.com"></textarea><input id="col" type="number" min="1" value="1" placeholder="Column number"><div class="tool-actions"><button id="go">Extract Column</button></div><pre id="out">Extracted values will appear here.</pre></div></section></main><script>function parse(s){const a=[];let x='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){x+='"';i++}else q=!q}else if(c===','&&!q){a.push(x);x=''}else x+=c}a.push(x);return a}go.onclick=()=>{const i=Math.max(0,(+col.value||1)-1),rows=src.value.trim().split(/\r?\n/).filter(Boolean).map(parse);out.textContent=rows.map(r=>r[i]??'').join('\n')}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
