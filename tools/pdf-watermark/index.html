<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Watermark to PDF Online | UWTools</title><meta name="description" content="Add a text watermark to every PDF page in your browser."><link rel="canonical" href="https://uwtools.com/tools/pdf-watermark/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/pdf-tools/">PDF Tools</a><a href="/image-tools/">Image Tools</a><a href="/developer-tools/">Developer</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">PDF Tools</div><h1>PDF Watermark</h1><p>Add a text watermark to every page.</p><div class="card tool-panel"><input id="file" type="file" accept="application/pdf"><input id="text" type="text" placeholder="Watermark text"><button id="go">Add Watermark</button><p id="status">Choose a PDF and enter watermark text.</p></div></section><section><h2>Private browser processing</h2><p>The PDF is edited locally in your browser and downloaded as a new file.</p></section></main><script>document.getElementById('go').onclick=async()=>{const f=document.getElementById('file').files[0],t=document.getElementById('text').value.trim(),s=document.getElementById('status');if(!f||!t)return s.textContent='Choose a PDF and enter text.';s.textContent='Applying watermark…';const d=await PDFLib.PDFDocument.load(await f.arrayBuffer()),font=await d.embedFont(PDFLib.StandardFonts.HelveticaBold);d.getPages().forEach(p=>{const {width,height}=p.getSize();p.drawText(t,{x:width*.18,y:height*.5,size:Math.max(24,Math.min(54,width/10)),font,rotate:PDFLib.degrees(35),opacity:.18})});const b=await d.save(),u=URL.createObjectURL(new Blob([b],{type:'application/pdf'})),a=document.createElement('a');a.href=u;a.download='watermarked.pdf';a.click();URL.revokeObjectURL(u);s.textContent='Done.'}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
