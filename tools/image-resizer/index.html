<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Resizer Online | UWTools</title><meta name="description" content="Resize JPG, PNG and WebP images to custom pixel dimensions directly in your browser."><link rel="canonical" href="https://uwtools.com/tools/image-resizer/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/pdf-tools/">PDF Tools</a><a href="/image-tools/">Image Tools</a><a href="/developer-tools/">Developer</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Image Tools</div><h1>Image Resizer</h1><p>Resize images to exact pixel dimensions.</p><div class="card tool-panel"><input id="file" type="file" accept="image/*"><div class="inline-fields"><input id="w" type="number" min="1" placeholder="Width px"><input id="h" type="number" min="1" placeholder="Height px"></div><label class="check"><input id="ratio" type="checkbox" checked> Keep aspect ratio</label><button id="go">Resize & Download</button><p id="status">Choose an image.</p></div></section></main><script>let img=new Image(),ow=0,oh=0;document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;img.onload=()=>{ow=img.width;oh=img.height;w.value=ow;h.value=oh;status.textContent=ow+' × '+oh+' px'};img.src=URL.createObjectURL(f)};w.oninput=()=>{if(ratio.checked&&ow)h.value=Math.round(+w.value*oh/ow)};h.oninput=()=>{if(ratio.checked&&oh)w.value=Math.round(+h.value*ow/oh)};go.onclick=()=>{if(!img.src)return status.textContent='Choose an image first.';const c=document.createElement('canvas');c.width=+w.value;c.height=+h.value;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='resized.png';a.click();URL.revokeObjectURL(u)},'image/png')}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
