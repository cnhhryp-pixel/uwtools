<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMI Calculator Online | UWTools</title><meta name="description" content="Calculate body mass index from height and weight directly in your browser."><link rel="canonical" href="https://uwtools.com/tools/bmi-calculator/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/developer-tools/">Developer</a><a href="/image-tools/">Images</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Calculator Tools</div><h1>BMI Calculator</h1><p>Calculate BMI from metric or imperial measurements.</p><div class="card tool-panel"><select id="unit"><option value="metric">Metric (kg / cm)</option><option value="imperial">Imperial (lb / in)</option></select><div class="inline-fields"><input id="weight" type="number" min="0" step="any" placeholder="Weight"><input id="height" type="number" min="0" step="any" placeholder="Height"></div><div class="tool-actions"><button id="go">Calculate BMI</button></div><pre id="out">BMI result will appear here.</pre></div></section></main><script>go.onclick=()=>{const w=+weight.value,h=+height.value;if(!(w>0&&h>0))return out.textContent='Enter valid height and weight.';const bmi=unit.value==='metric'?w/Math.pow(h/100,2):703*w/Math.pow(h,2);out.textContent='BMI: '+bmi.toFixed(1)}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
