<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extract PDF Pages Online | UWTools</title><meta name="description" content="Extract selected pages or page ranges from a PDF directly in your browser."><link rel="canonical" href="https://uwtools.com/tools/pdf-page-extractor/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/pdf-tools/">PDF Tools</a><a href="/image-tools/">Image Tools</a><a href="/developer-tools/">Developer</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">PDF Tools</div><h1>PDF Page Extractor</h1><p>Extract pages such as 1-3,5,8 into a new PDF.</p><div class="card tool-panel"><input id="file" type="file" accept="application/pdf"><input id="pages" type="text" placeholder="Example: 1-3,5,8"><button id="go">Extract Pages</button><p id="status">Choose a PDF and page range.</p></div></section></main><script>function parse(v,n){const out=[];v.split(',').forEach(part=>{const q=part.trim();if(!q)return;if(q.includes('-')){let[a,b]=q.split('-').map(Number);for(let i=Math.max(1,a);i<=Math.min(n,b);i++)out.push(i-1)}else{const x=Number(q);if(x>=1&&x<=n)out.push(x-1)}});return [...new Set(out)]}document.getElementById('go').onclick=async()=>{const f=document.getElementById('file').files[0],r=document.getElementById('pages').value,s=document.getElementById('status');if(!f||!r)return s.textContent='Choose a PDF and page range.';s.textContent='Extracting…';const src=await PDFLib.PDFDocument.load(await f.arrayBuffer()),ids=parse(r,src.getPageCount());if(!ids.length)return s.textContent='No valid pages selected.';const out=await PDFLib.PDFDocument.create(),pages=await out.copyPages(src,ids);pages.forEach(p=>out.addPage(p));const b=await out.save(),u=URL.createObjectURL(new Blob([b],{type:'application/pdf'})),a=document.createElement('a');a.href=u;a.download='extracted-pages.pdf';a.click();URL.revokeObjectURL(u);s.textContent='Done.'}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
