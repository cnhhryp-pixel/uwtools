<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Formatter & Validator — UWTools</title><meta name="description" content="Free online JSON formatter, validator and minifier. Runs locally in your browser."><link rel="canonical" href="https://uwtools.com/tools/json-formatter/"><link rel="stylesheet" href="/assets/style.css"><style>.tool{max-width:980px;margin:55px auto;padding:0 24px}.tool h1{font-size:40px;margin-bottom:8px}.tool>p{color:#667085}.editor{width:100%;min-height:340px;padding:18px;border:1px solid #d7dce5;border-radius:14px;font:14px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;resize:vertical}.actions{display:flex;gap:10px;margin:14px 0}.actions button{border:0;border-radius:9px;padding:10px 15px;font-weight:650;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#eef2f6;color:#172033}#status{font-size:14px;color:#667085}</style></head><body><header><a class="brand" href="/">UW<span>Tools</span></a><nav><a href="/">All Tools</a></nav></header><main class="tool"><h1>JSON Formatter</h1><p>Format, validate or minify JSON instantly. Your data stays in your browser.</p><textarea id="input" class="editor" spellcheck="false" placeholder='Paste JSON here, e.g. {"name":"UWTools"}'></textarea><div class="actions"><button class="primary" onclick="formatJson()">Format JSON</button><button class="secondary" onclick="minifyJson()">Minify</button><button class="secondary" onclick="copyJson()">Copy</button><button class="secondary" onclick="input.value='';status.textContent=''">Clear</button></div><div id="status"></div></main><footer>© 2026 UWTools</footer><script>const input=document.querySelector("#input"),status=document.querySelector("#status");function parse(){try{const v=JSON.parse(input.value);status.textContent="✓ Valid JSON";status.style.color="#15803d";return v}catch(e){status.textContent="Invalid JSON: "+e.message;status.style.color="#b42318";return null}}function formatJson(){const v=parse();if(v!==null)input.value=JSON.stringify(v,null,2)}function minifyJson(){const v=parse();if(v!==null)input.value=JSON.stringify(v)}async function copyJson(){await navigator.clipboard.writeText(input.value);status.textContent="Copied to clipboard";status.style.color="#15803d"}</script></body></html>
