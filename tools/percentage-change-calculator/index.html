<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percentage Change Calculator | UWTools</title><meta name="description" content="Calculate percentage increase or decrease between two values."><link rel="canonical" href="https://uwtools.com/tools/percentage-change-calculator/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/developer-tools/">Developer</a><a href="/converter-tools/">Converters</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Calculator Tools</div><h1>Percentage Change Calculator</h1><p>Find the percentage change from an old value to a new value.</p><div class="card tool-panel"><div class="inline-fields"><input id="oldv" type="number" step="any" placeholder="Old value"><input id="newv" type="number" step="any" placeholder="New value"></div><div class="tool-actions"><button id="go">Calculate Change</button></div><pre id="out">Percentage change will appear here.</pre></div></section></main><script>go.onclick=()=>{const a=+oldv.value,b=+newv.value;if(!Number.isFinite(a)||!Number.isFinite(b)||a===0)return out.textContent='Enter valid values; old value cannot be 0.';const p=(b-a)/Math.abs(a)*100;out.textContent=(p>=0?'Increase: ':'Decrease: ')+Math.abs(p).toFixed(2)+'%\nDifference: '+(b-a)}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
