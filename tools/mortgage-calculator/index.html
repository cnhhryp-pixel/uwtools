<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mortgage Calculator Online | UWTools</title><meta name="description" content="Estimate monthly mortgage payments, total payments and total interest."><link rel="canonical" href="https://uwtools.com/tools/mortgage-calculator/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/developer-tools/">Developer</a><a href="/converter-tools/">Converters</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Calculator Tools</div><h1>Mortgage Calculator</h1><p>Estimate a fixed-rate monthly mortgage payment.</p><div class="card tool-panel"><input id="loan" type="number" min="0" step="0.01" placeholder="Loan amount"><input id="rate" type="number" min="0" step="0.01" placeholder="Annual interest rate %"><input id="years" type="number" min="1" step="1" placeholder="Loan term in years"><div class="tool-actions"><button id="go">Calculate Mortgage</button></div><pre id="out">Mortgage estimate will appear here.</pre></div></section></main><script>go.onclick=()=>{const P=+loan.value,n=+years.value*12,r=+rate.value/1200;if(!(P>0&&n>0&&r>=0))return out.textContent='Enter valid loan details.';const pay=r===0?P/n:P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1),total=pay*n;out.textContent='Monthly payment: '+pay.toFixed(2)+'\nTotal paid: '+total.toFixed(2)+'\nTotal interest: '+(total-P).toFixed(2)}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
