<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discount Calculator Online | UWTools</title><meta name="description" content="Calculate sale price and savings from an original price and discount percentage."><link rel="canonical" href="https://uwtools.com/tools/discount-calculator/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/developer-tools/">Developer</a><a href="/text-tools/">Text</a><a href="/calculator-tools/">Calculators</a><a href="/converter-tools/">Converters</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Calculator Tools</div><h1>Discount Calculator</h1><p>Find the final price after a percentage discount.</p><div class="card tool-panel"><input id="price" type="number" min="0" step="0.01" placeholder="Original price"><input id="disc" type="number" min="0" max="100" step="0.01" placeholder="Discount %"><div class="tool-actions"><button id="go">Calculate Discount</button></div><pre id="out">Result will appear here.</pre></div></section></main><script>go.onclick=()=>{const p=+price.value,d=+disc.value;if(!(p>=0&&d>=0&&d<=100))return out.textContent='Enter a valid price and discount.';const save=p*d/100;out.textContent='Final price: '+(p-save).toFixed(2)+'\nYou save: '+save.toFixed(2)}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
