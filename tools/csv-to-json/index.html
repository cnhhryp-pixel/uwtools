<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV to JSON Converter Online | UWTools</title><meta name="description" content="Convert simple CSV data to JSON locally in your browser."><link rel="canonical" href="https://uwtools.com/tools/csv-to-json/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/developer-tools/">Developer</a><a href="/converter-tools/">Converters</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Converter Tools</div><h1>CSV to JSON</h1><p>Convert comma-separated data into a JSON array.</p><div class="card tool-panel"><textarea id="csv" rows="10" placeholder="name,email&#10;Alex,alex@example.com"></textarea><button id="go">Convert to JSON</button><pre id="out">JSON output will appear here.</pre></div></section></main><script>function parseLine(line){const a=[];let s='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){s+='"';i++}else q=!q}else if(c===','&&!q){a.push(s);s=''}else s+=c}a.push(s);return a}go.onclick=()=>{try{const lines=csv.value.trim().split(/\r?\n/).filter(Boolean);if(lines.length<2)throw Error('Add a header row and at least one data row');const h=parseLine(lines[0]);const rows=lines.slice(1).map(l=>{const v=parseLine(l),o={};h.forEach((k,i)=>o[k.trim()]=v[i]??'');return o});out.textContent=JSON.stringify(rows,null,2)}catch(e){out.textContent='Error: '+e.message}}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
