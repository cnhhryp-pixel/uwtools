<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volume Converter Online | UWTools</title><meta name="description" content="Convert liters, milliliters, US gallons, cups and fluid ounces."><link rel="canonical" href="https://uwtools.com/tools/volume-converter/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/converter-tools/">Converters</a><a href="/calculator-tools/">Calculators</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Converter Tools</div><h1>Volume Converter</h1><p>Convert common liquid volume units instantly.</p><div class="card tool-panel"><input id="v" type="number" step="any" placeholder="Value"><select id="from"><option value="l">Liters</option><option value="ml">Milliliters</option><option value="gal">US Gallons</option><option value="cup">US Cups</option><option value="floz">US Fluid Ounces</option></select><select id="to"><option value="gal">US Gallons</option><option value="l">Liters</option><option value="ml">Milliliters</option><option value="cup">US Cups</option><option value="floz">US Fluid Ounces</option></select><div class="tool-actions"><button id="go">Convert</button></div><pre id="out">Converted value will appear here.</pre></div></section></main><script>const f={l:1,ml:.001,gal:3.785411784,cup:.2365882365,floz:.0295735295625};go.onclick=()=>{const x=+v.value;if(!Number.isFinite(x))return out.textContent='Enter a number.';out.textContent=(x*f[from.value]/f[to.value]).toLocaleString(undefined,{maximumFractionDigits:8})+' '+to.value}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
