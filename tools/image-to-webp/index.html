<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image to WebP Converter | UWTools</title><meta name="description" content="Convert JPG or PNG images to WebP locally in your browser."><link rel="canonical" href="https://uwtools.com/tools/image-to-webp/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/image-tools/">Images</a><a href="/developer-tools/">Developer</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Image Tools</div><h1>Image to WebP</h1><p>Convert images to WebP with adjustable quality.</p><div class="card tool-panel"><input id="file" type="file" accept="image/jpeg,image/png"><label>Quality <input id="q" type="range" min="50" max="100" value="85"></label><div class="tool-actions"><button id="go">Convert to WebP</button></div><p id="status">Choose an image.</p></div></section></main><script>go.onclick=()=>{const f=file.files[0];if(!f)return status.textContent='Choose an image first.';const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);c.toBlob(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='converted.webp';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);status.textContent='Done.'},'image/webp',+q.value/100)};img.src=URL.createObjectURL(f)}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
