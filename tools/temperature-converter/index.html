<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temperature Converter — UWTools</title><meta name="description" content="Convert Celsius, Fahrenheit and Kelvin."><link rel="stylesheet" href="/assets/style.css"><style>.tool{max-width:900px;margin:55px auto;padding:0 24px}.tool h1{font-size:40px;margin-bottom:8px}.tool>p{color:#667085}.editor{width:100%;min-height:210px;padding:16px;border:1px solid #d7dce5;border-radius:14px;font:15px/1.5 ui-monospace,monospace}.field{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:9px;margin:6px 0}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.actions button{border:0;border-radius:9px;padding:11px 15px;font-weight:650;cursor:pointer}.primary{background:#2563eb!important;color:#fff}.result{margin:15px 0;padding:17px;background:#f8fafc;border-radius:12px;word-break:break-word}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="/">UW<span>Tools</span></a><nav><a href="/">All Tools</a></nav></header><main class="tool"><h1>Temperature Converter</h1><p>Convert Celsius, Fahrenheit and Kelvin.</p><input id="v" class="field" type="number" value="20"><select id="u" class="field"><option value="c">Celsius</option><option value="f">Fahrenheit</option><option value="k">Kelvin</option></select><div class="actions"><button class="primary" onclick="go()">Convert</button></div><div id="out" class="result"></div></main><footer>© 2026 UWTools</footer><script>function go(){let x=+v.value,c=u.value==="c"?x:u.value==="f"?(x-32)*5/9:x-273.15;out.innerText=c.toFixed(2)+" °C\n"+(c*9/5+32).toFixed(2)+" °F\n"+(c+273.15).toFixed(2)+" K"}go()</script></body></html>
