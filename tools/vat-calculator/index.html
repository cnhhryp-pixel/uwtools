<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAT Calculator Online | UWTools</title><meta name="description" content="Add or remove VAT from a price with any tax rate."><link rel="canonical" href="https://uwtools.com/tools/vat-calculator/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/developer-tools/">Developer</a><a href="/image-tools/">Images</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Calculator Tools</div><h1>VAT Calculator</h1><p>Calculate VAT-inclusive or VAT-exclusive prices.</p><div class="card tool-panel"><input id="amount" type="number" min="0" step="0.01" placeholder="Amount"><input id="rate" type="number" min="0" step="0.01" value="20" placeholder="VAT rate %"><select id="mode"><option value="add">Add VAT</option><option value="remove">Remove VAT</option></select><div class="tool-actions"><button id="go">Calculate VAT</button></div><pre id="out">VAT calculation will appear here.</pre></div></section></main><script>go.onclick=()=>{const a=+amount.value,r=+rate.value;if(!(a>=0&&r>=0))return out.textContent='Enter valid values.';if(mode.value==='add'){const tax=a*r/100;out.textContent='VAT: '+tax.toFixed(2)+'\nTotal incl. VAT: '+(a+tax).toFixed(2)}else{const net=a/(1+r/100),tax=a-net;out.textContent='Net amount: '+net.toFixed(2)+'\nVAT included: '+tax.toFixed(2)}}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
