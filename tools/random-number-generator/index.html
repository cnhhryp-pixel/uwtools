<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Number Generator — UWTools</title><meta name="description" content="Generate cryptographically strong random integers in a range."><link rel="canonical" href="https://uwtools.com/tools/random-number-generator/"><link rel="stylesheet" href="/assets/style.css"><style>.tool{max-width:900px;margin:55px auto;padding:0 24px}.tool h1{font-size:40px;margin-bottom:8px}.tool>p{color:#667085}.editor{width:100%;min-height:220px;padding:16px;border:1px solid #d7dce5;border-radius:14px;font:15px/1.5 ui-monospace,monospace}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.actions button{border:0;border-radius:9px;padding:11px 15px;font-weight:650;cursor:pointer}.primary{background:#2563eb!important;color:#fff}.field{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:9px;margin:6px 0}.result{margin:15px 0;padding:17px;background:#f8fafc;border-radius:12px;word-break:break-all}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="/">UW<span>Tools</span></a><nav><a href="/">All Tools</a></nav></header><main class="tool"><h1>Random Number Generator</h1><p>Generate cryptographically strong random integers in a range.</p><div class="row"><label>Minimum<input id="min" class="field" type="number" value="1"></label><label>Maximum<input id="max" class="field" type="number" value="100"></label></div><div class="actions"><button class="primary" onclick="go()">Generate</button></div><div id="out" class="result"></div></main><footer>© 2026 UWTools</footer><script>function go(){let a=Math.ceil(+min.value),b=Math.floor(+max.value);if(b<a){out.textContent="Maximum must be ≥ minimum";return}let x=new Uint32Array(1);crypto.getRandomValues(x);out.textContent=a+(x[0]%(b-a+1))}go()</script></body></html>
