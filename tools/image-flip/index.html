<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flip Image Online | UWTools</title><meta name="description" content="Flip an image horizontally or vertically directly in your browser."><link rel="canonical" href="https://uwtools.com/tools/image-flip/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/image-tools/">Images</a><a href="/developer-tools/">Developer</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Image Tools</div><h1>Flip Image</h1><p>Mirror an image horizontally or vertically and download the result.</p><div class="card tool-panel"><input id="file" type="file" accept="image/*"><select id="mode"><option value="h">Flip horizontally</option><option value="v">Flip vertically</option></select><div class="tool-actions"><button id="go">Flip & Download</button></div><p id="status">Choose an image.</p></div></section></main><script>let img=new Image();file.onchange=e=>{const f=e.target.files[0];if(!f)return;img.onload=()=>status.textContent=img.width+' × '+img.height+' px';img.src=URL.createObjectURL(f)};go.onclick=()=>{if(!img.src)return status.textContent='Choose an image first.';const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');if(mode.value==='h'){x.translate(c.width,0);x.scale(-1,1)}else{x.translate(0,c.height);x.scale(1,-1)}x.drawImage(img,0,0);c.toBlob(b=>{const u=URL.createObjectURL(b),d=document.createElement('a');d.href=u;d.download='flipped.png';d.click();setTimeout(()=>URL.revokeObjectURL(u),1000)},'image/png')}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
