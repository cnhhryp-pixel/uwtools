<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grayscale Image Online | UWTools</title><meta name="description" content="Convert an image to grayscale directly in your browser."><link rel="canonical" href="https://uwtools.com/tools/image-grayscale/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/developer-tools/">Developer</a><a href="/image-tools/">Images</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Image Tools</div><h1>Grayscale Image</h1><p>Turn any image black and white locally.</p><div class="card tool-panel"><input id="file" type="file" accept="image/*"><div class="tool-actions"><button id="go">Convert to Grayscale</button></div><p id="status">Choose an image.</p></div></section></main><script>go.onclick=()=>{const f=file.files[0];if(!f)return status.textContent='Choose an image first.';const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.drawImage(img,0,0);const d=x.getImageData(0,0,c.width,c.height);for(let i=0;i<d.data.length;i+=4){const g=.299*d.data[i]+.587*d.data[i+1]+.114*d.data[i+2];d.data[i]=d.data[i+1]=d.data[i+2]=g}x.putImageData(d,0,0);c.toBlob(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='grayscale.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);status.textContent='Done.'},'image/png')};img.src=URL.createObjectURL(f)}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
