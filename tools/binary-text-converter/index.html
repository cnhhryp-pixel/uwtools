<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binary Text Converter | UWTools</title><meta name="description" content="Convert plain text to binary and binary back to text locally in your browser."><link rel="canonical" href="https://uwtools.com/tools/binary-text-converter/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/developer-tools/">Developer</a><a href="/converter-tools/">Converters</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Converter Tools</div><h1>Binary Text Converter</h1><p>Convert UTF-8 text to binary bytes or decode binary text.</p><div class="card tool-panel"><textarea id="src" rows="8" placeholder="Enter text or binary bytes like 01001000 01101001"></textarea><div class="tool-actions"><button id="toBin">Text to Binary</button><button id="toText">Binary to Text</button></div><pre id="out">Result will appear here.</pre></div></section></main><script>toBin.onclick=()=>{const bytes=new TextEncoder().encode(src.value);out.textContent=[...bytes].map(b=>b.toString(2).padStart(8,'0')).join(' ')};toText.onclick=()=>{try{const parts=src.value.trim().split(/\s+/).filter(Boolean);if(parts.some(x=>!/^[01]{8}$/.test(x)))throw Error('Use 8-bit binary bytes separated by spaces');out.textContent=new TextDecoder().decode(new Uint8Array(parts.map(x=>parseInt(x,2))))}catch(e){out.textContent='Error: '+e.message}}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
