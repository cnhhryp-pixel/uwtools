<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQL Formatter Online | UWTools</title><meta name="description" content="Format common SQL statements with readable line breaks and indentation."><link rel="canonical" href="https://uwtools.com/tools/sql-formatter/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/developer-tools/">Developer</a><a href="/image-tools/">Images</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Developer Tools</div><h1>SQL Formatter</h1><p>Make SQL easier to read with simple browser-based formatting.</p><div class="card tool-panel"><textarea id="src" rows="12" placeholder="select id,name from users where active=1 order by name;"></textarea><div class="tool-actions"><button id="go">Format SQL</button><button id="copy" type="button">Copy</button></div><pre id="out">Formatted SQL will appear here.</pre></div></section></main><script>const keys=['SELECT','FROM','WHERE','GROUP BY','ORDER BY','HAVING','LIMIT','OFFSET','LEFT JOIN','RIGHT JOIN','INNER JOIN','OUTER JOIN','JOIN','UNION','VALUES','SET'];function fmt(s){let x=s.trim().replace(/\s+/g,' ');for(const k of keys){const re=new RegExp('\\s+'+k.replace(' ','\\s+')+'\\s+','ig');x=x.replace(re,'\n'+k+' ')}x=x.replace(/\b(select|from|where|group by|order by|having|limit|offset|left join|right join|inner join|outer join|join|union|values|set|and|or|as|on|insert into|update|delete from)\b/ig,m=>m.toUpperCase());x=x.replace(/\s*,\s*/g,', ');return x.trim()}go.onclick=()=>out.textContent=fmt(src.value);copy.onclick=()=>navigator.clipboard.writeText(out.textContent)</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
