<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favicon Generator Online | UWTools</title><meta name="description" content="Create a square favicon PNG from any image directly in your browser."><link rel="canonical" href="https://uwtools.com/tools/favicon-generator/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/developer-tools/">Developer</a><a href="/image-tools/">Images</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Image Tools</div><h1>Favicon Generator</h1><p>Generate a 64×64 favicon image from an uploaded picture.</p><div class="card tool-panel"><input id="file" type="file" accept="image/*"><div class="tool-actions"><button id="go">Generate Favicon</button></div><p id="status">Choose an image.</p></div></section></main><script>go.onclick=()=>{const f=file.files[0];if(!f)return status.textContent='Choose an image first.';const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),s=Math.min(img.width,img.height),sx=(img.width-s)/2,sy=(img.height-s)/2;x.drawImage(img,sx,sy,s,s,0,0,64,64);c.toBlob(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='favicon.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);status.textContent='Done.'},'image/png')};img.src=URL.createObjectURL(f)}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
