<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Page Numbers to PDF Online | UWTools</title><meta name="description" content="Add page numbers to every page of a PDF locally in your browser."><link rel="canonical" href="https://uwtools.com/tools/pdf-page-number/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/pdf-tools/">PDF Tools</a><a href="/image-tools/">Image Tools</a><a href="/developer-tools/">Developer</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">PDF Tools</div><h1>Add Page Numbers to PDF</h1><p>Number PDF pages automatically and download a new copy.</p><div class="card tool-panel"><input id="file" type="file" accept="application/pdf"><select id="pos"><option value="bottom">Bottom center</option><option value="top">Top center</option></select><button id="go">Add Page Numbers</button><p id="status">Choose a PDF to begin.</p></div></section></main><script>document.getElementById('go').onclick=async()=>{const f=document.getElementById('file').files[0],s=document.getElementById('status');if(!f)return s.textContent='Choose a PDF first.';s.textContent='Adding numbers…';const d=await PDFLib.PDFDocument.load(await f.arrayBuffer()),font=await d.embedFont(PDFLib.StandardFonts.Helvetica),pages=d.getPages(),pos=document.getElementById('pos').value;pages.forEach((p,i)=>{const {width,height}=p.getSize(),txt=String(i+1),size=11,w=font.widthOfTextAtSize(txt,size);p.drawText(txt,{x:(width-w)/2,y:pos==='top'?height-24:18,size,font})});const b=await d.save(),u=URL.createObjectURL(new Blob([b],{type:'application/pdf'})),a=document.createElement('a');a.href=u;a.download='numbered.pdf';a.click();URL.revokeObjectURL(u);s.textContent='Done.'}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
