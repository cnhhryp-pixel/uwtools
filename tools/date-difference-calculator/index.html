<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date Difference Calculator | UWTools</title><meta name="description" content="Calculate the number of days and weeks between two dates."><link rel="canonical" href="https://uwtools.com/tools/date-difference-calculator/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/developer-tools/">Developer</a><a href="/text-tools/">Text</a><a href="/calculator-tools/">Calculators</a><a href="/converter-tools/">Converters</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Calculator Tools</div><h1>Date Difference Calculator</h1><p>Find the difference between any two calendar dates.</p><div class="card tool-panel"><div class="inline-fields"><label>Start date <input id="a" type="date"></label><label>End date <input id="b" type="date"></label></div><div class="tool-actions"><button id="go">Calculate Difference</button></div><pre id="out">Difference will appear here.</pre></div></section></main><script>go.onclick=()=>{if(!a.value||!b.value)return out.textContent='Choose both dates.';const x=new Date(a.value+'T00:00:00'),y=new Date(b.value+'T00:00:00'),days=Math.round((y-x)/86400000),abs=Math.abs(days);out.textContent=(days<0?'-':'')+abs+' days\n'+(abs/7).toFixed(2)+' weeks'}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
