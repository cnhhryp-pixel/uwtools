<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meta Tag Generator — UWTools</title><meta name="description" content="Generate essential HTML title, description and Open Graph meta tags."><link rel="canonical" href="https://uwtools.com/tools/meta-tag-generator/"><link rel="stylesheet" href="/assets/style.css"><style>.tool{max-width:900px;margin:55px auto;padding:0 24px}.tool h1{font-size:40px;margin-bottom:8px}.tool>p{color:#667085}.editor{width:100%;min-height:220px;padding:16px;border:1px solid #d7dce5;border-radius:14px;font:15px/1.5 ui-monospace,monospace}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.actions button{border:0;border-radius:9px;padding:11px 15px;font-weight:650;cursor:pointer}.primary{background:#2563eb!important;color:#fff}.field{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:9px;margin:6px 0}.result{margin:15px 0;padding:17px;background:#f8fafc;border-radius:12px;word-break:break-all}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="/">UW<span>Tools</span></a><nav><a href="/">All Tools</a></nav></header><main class="tool"><h1>Meta Tag Generator</h1><p>Generate essential HTML title, description and Open Graph meta tags.</p><input id="title" class="field" placeholder="Page title"><textarea id="desc" class="editor" style="min-height:100px" placeholder="Meta description"></textarea><input id="url" class="field" placeholder="Canonical URL"><div class="actions"><button class="primary" onclick="go()">Generate Tags</button></div><textarea id="out" class="editor" readonly></textarea></main><footer>© 2026 UWTools</footer><script>function esc(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;")}function go(){out.value='<title>'+title.value+'</title>\n<meta name="description" content="'+esc(desc.value)+'">\n<link rel="canonical" href="'+esc(url.value)+'">\n<meta property="og:title" content="'+esc(title.value)+'">\n<meta property="og:description" content="'+esc(desc.value)+'">\n<meta property="og:url" content="'+esc(url.value)+'">'}</script></body></html>
