<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Watermark Online | UWTools</title><meta name="description" content="Add a text watermark to an image locally in your browser."><link rel="canonical" href="https://uwtools.com/tools/image-watermark/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/developer-tools/">Developer</a><a href="/image-tools/">Images</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Image Tools</div><h1>Image Watermark</h1><p>Add custom text to an image and download the result.</p><div class="card tool-panel"><input id="file" type="file" accept="image/*"><input id="text" type="text" placeholder="Watermark text"><div class="tool-actions"><button id="go">Add Watermark</button></div><p id="status">Choose an image and enter text.</p></div></section></main><script>go.onclick=()=>{const f=file.files[0],t=text.value.trim();if(!f||!t)return status.textContent='Choose an image and enter text.';const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.drawImage(img,0,0);const size=Math.max(20,Math.round(c.width/18));x.font='bold '+size+'px sans-serif';x.fillStyle='rgba(255,255,255,.65)';x.textAlign='right';x.fillText(t,c.width-20,c.height-20);c.toBlob(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='watermarked.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);status.textContent='Done.'},'image/png')};img.src=URL.createObjectURL(f)}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
