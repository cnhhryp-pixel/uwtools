<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speed Converter Online | UWTools</title><meta name="description" content="Convert kilometers per hour, miles per hour, meters per second and knots."><link rel="canonical" href="https://uwtools.com/tools/speed-converter/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/converter-tools/">Converters</a><a href="/calculator-tools/">Calculators</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Converter Tools</div><h1>Speed Converter</h1><p>Convert common speed units instantly.</p><div class="card tool-panel"><input id="v" type="number" step="any" placeholder="Value"><select id="from"><option value="kmh">km/h</option><option value="mph">mph</option><option value="ms">m/s</option><option value="knot">knots</option></select><select id="to"><option value="mph">mph</option><option value="kmh">km/h</option><option value="ms">m/s</option><option value="knot">knots</option></select><div class="tool-actions"><button id="go">Convert</button></div><pre id="out">Converted value will appear here.</pre></div></section></main><script>const f={kmh:1,mph:1.609344,ms:3.6,knot:1.852};go.onclick=()=>{const x=+v.value;if(!Number.isFinite(x))return out.textContent='Enter a number.';out.textContent=(x*f[from.value]/f[to.value]).toLocaleString(undefined,{maximumFractionDigits:8})+' '+to.value}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
