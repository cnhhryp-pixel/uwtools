<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROI Calculator Online | UWTools</title><meta name="description" content="Calculate return on investment, profit and final value from investment cost and return amount."><link rel="canonical" href="https://uwtools.com/tools/roi-calculator/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/converter-tools/">Converters</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Calculator Tools</div><h1>ROI Calculator</h1><p>Measure investment return as a percentage.</p><div class="card tool-panel"><input id="cost" type="number" step="0.01" value="1000" placeholder="Investment cost"><input id="finalv" type="number" step="0.01" value="1250" placeholder="Final value / return"><div class="metric-row"><div><b id="profit">250.00</b><span>Profit</span></div><div><b id="roi">25.00%</b><span>ROI</span></div><div><b id="multiple">1.25×</b><span>Return multiple</span></div></div><p id="status" class="status-line">Results update instantly.</p></div></section><section><h2>ROI formula</h2><p>ROI = (final value − investment cost) ÷ investment cost × 100.</p></section></main><script>function calc(){const c=Number(cost.value),f=Number(finalv.value);if(!(c>0&&Number.isFinite(f))){status.textContent='Investment cost must be greater than zero.';return}const p=f-c,r=p/c*100;profit.textContent=p.toFixed(2);roi.textContent=r.toFixed(2)+'%';multiple.textContent=(f/c).toFixed(2)+'×';status.textContent=r>=0?'Positive return.':'Negative return.'}[cost,finalv].forEach(x=>x.oninput=calc);calc()</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
