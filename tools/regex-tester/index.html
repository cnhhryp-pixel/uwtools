<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regex Tester — UWTools</title><meta name="description" content="Test JavaScript regular expressions against text in your browser."><link rel="canonical" href="https://uwtools.com/tools/regex-tester/"><link rel="stylesheet" href="/assets/style.css"><style>.tool{max-width:900px;margin:55px auto;padding:0 24px}.tool h1{font-size:40px;margin-bottom:8px}.tool>p{color:#667085}.editor{width:100%;min-height:220px;padding:16px;border:1px solid #d7dce5;border-radius:14px;font:15px/1.5 ui-monospace,monospace}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.actions button{border:0;border-radius:9px;padding:11px 15px;font-weight:650;cursor:pointer}.primary{background:#2563eb!important;color:#fff}.field{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:9px;margin:6px 0}.result{margin:15px 0;padding:17px;background:#f8fafc;border-radius:12px;word-break:break-all}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="/">UW<span>Tools</span></a><nav><a href="/">All Tools</a></nav></header><main class="tool"><h1>Regex Tester</h1><p>Test JavaScript regular expressions against text in your browser.</p><input id="pat" class="field" placeholder="Pattern e.g. \b\w+@\w+\.\w+\b"><input id="flags" class="field" value="gi" placeholder="Flags"><textarea id="v" class="editor" placeholder="Test text…"></textarea><div class="actions"><button class="primary" onclick="go()">Test Regex</button></div><div id="out" class="result"></div></main><footer>© 2026 UWTools</footer><script>function go(){try{const r=new RegExp(pat.value,flags.value),m=[...v.value.matchAll(r)].map(x=>x[0]);out.textContent=m.length?m.length+" match(es): "+m.join(" · "):"No matches"}catch(e){out.textContent=e.message}}</script></body></html>
