<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit Price Calculator | UWTools</title><meta name="description" content="Compare price per unit for two products or pack sizes."><link rel="canonical" href="https://uwtools.com/tools/unit-price-calculator/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/developer-tools/">Developer</a><a href="/converter-tools/">Converters</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Calculator Tools</div><h1>Unit Price Calculator</h1><p>Calculate cost per item, gram, kilogram, ounce or any other unit.</p><div class="card tool-panel"><input id="price" type="number" min="0" step="0.01" placeholder="Total price"><input id="qty" type="number" min="0" step="any" placeholder="Quantity"><input id="label" type="text" placeholder="Unit name (optional, e.g. kg)"><div class="tool-actions"><button id="go">Calculate Unit Price</button></div><pre id="out">Unit price will appear here.</pre></div></section></main><script>go.onclick=()=>{const p=+price.value,q=+qty.value;if(!(p>=0&&q>0))return out.textContent='Enter a valid price and quantity.';out.textContent='Price per '+(label.value.trim()||'unit')+': '+(p/q).toFixed(4)}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
