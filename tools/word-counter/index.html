<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Counter — UWTools</title><meta name="description" content="Count words, characters, sentences and lines in real time."><link rel="stylesheet" href="/assets/style.css"><style>.tool{max-width:900px;margin:55px auto;padding:0 24px}.tool h1{font-size:40px;margin-bottom:8px}.tool>p{color:#667085}.editor{width:100%;min-height:280px;padding:16px;border:1px solid #d7dce5;border-radius:14px;font:15px/1.5 ui-monospace,monospace}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.actions button,.primary{border:0;border-radius:9px;padding:11px 15px;font-weight:650;cursor:pointer}.primary{background:#2563eb!important;color:#fff}.field{padding:11px;border:1px solid #d7dce5;border-radius:9px;margin:8px;max-width:230px}.result{margin:18px 0;padding:18px;border-radius:12px;background:#f8fafc;word-break:break-all;font:16px ui-monospace,monospace;min-height:54px}.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}.stats b{background:#f8fafc;padding:10px 14px;border-radius:9px}.calcrow{display:flex;flex-wrap:wrap;align-items:center;gap:5px}</style></head><body><header><a class="brand" href="/">UW<span>Tools</span></a><nav><a href="/">All Tools</a></nav></header><main class="tool"><h1>Word Counter</h1><p>Count words, characters, sentences and lines in real time.</p><textarea id="v" class="editor" placeholder="Type or paste text here…"></textarea><div class="stats"><b id="w">0 words</b><b id="c">0 characters</b><b id="se">0 sentences</b><b id="l">0 lines</b></div></main><footer>© 2026 UWTools</footer><script>function calc(){const x=v.value.trim();w.textContent=(x?x.split(/\s+/).length:0)+" words";c.textContent=v.value.length+" characters";se.textContent=(x?(x.match(/[.!?]+(?=\s|$)/g)||[]).length:0)+" sentences";l.textContent=(v.value?v.value.split(/\n/).length:0)+" lines"}v.addEventListener("input",calc);calc()</script></body></html>
