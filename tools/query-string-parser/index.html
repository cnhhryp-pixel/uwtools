<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Query String Parser Online | UWTools</title><meta name="description" content="Parse URL query parameters into readable key-value data."><link rel="canonical" href="https://uwtools.com/tools/query-string-parser/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/developer-tools/">Developer</a><a href="/text-tools/">Text</a><a href="/calculator-tools/">Calculators</a><a href="/image-tools/">Images</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Developer Tools</div><h1>Query String Parser</h1><p>Turn a query string or full URL into structured parameters.</p><div class="card tool-panel"><textarea id="src" rows="5" placeholder="?utm_source=google&utm_campaign=test"></textarea><div class="tool-actions"><button id="go">Parse Query</button></div><pre id="out">Parameters will appear here.</pre></div></section></main><script>go.onclick=()=>{try{let v=src.value.trim(),q=v;if(/^https?:\/\//i.test(v))q=new URL(v).search;const p=new URLSearchParams(q.startsWith('?')?q.slice(1):q),o={};for(const [k,val] of p.entries()){if(k in o)o[k]=Array.isArray(o[k])?[...o[k],val]:[o[k],val];else o[k]=val}out.textContent=JSON.stringify(o,null,2)}catch(e){out.textContent='Error: '+e.message}}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
