<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loan Payment Calculator | UWTools</title><meta name="description" content="Estimate monthly loan payments from principal, interest rate and term."><link rel="canonical" href="https://uwtools.com/tools/loan-payment-calculator/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/developer-tools/">Developer</a><a href="/text-tools/">Text</a><a href="/calculator-tools/">Calculators</a><a href="/converter-tools/">Converters</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Calculator Tools</div><h1>Loan Payment Calculator</h1><p>Estimate a fixed monthly loan payment.</p><div class="card tool-panel"><input id="p" type="number" min="0" step="0.01" placeholder="Loan amount"><input id="r" type="number" min="0" step="0.01" placeholder="Annual interest rate %"><input id="n" type="number" min="1" step="1" placeholder="Term in months"><div class="tool-actions"><button id="go">Calculate Payment</button></div><pre id="out">Payment estimate will appear here.</pre></div></section></main><script>go.onclick=()=>{const P=+p.value,R=+r.value/1200,N=+n.value;if(!(P>0&&N>0))return out.textContent='Enter a loan amount and term.';const pay=R===0?P/N:P*R*Math.pow(1+R,N)/(Math.pow(1+R,N)-1),total=pay*N;out.textContent='Monthly payment: '+pay.toFixed(2)+'\nTotal paid: '+total.toFixed(2)+'\nTotal interest: '+(total-P).toFixed(2)}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
