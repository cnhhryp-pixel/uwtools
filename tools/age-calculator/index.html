<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Age Calculator Online | UWTools</title><meta name="description" content="Calculate age in years, months and days from a birth date."><link rel="canonical" href="https://uwtools.com/tools/age-calculator/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/developer-tools/">Developer</a><a href="/text-tools/">Text</a><a href="/calculator-tools/">Calculators</a><a href="/converter-tools/">Converters</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Calculator Tools</div><h1>Age Calculator</h1><p>Calculate your exact age from a date of birth.</p><div class="card tool-panel"><label>Date of birth <input id="dob" type="date"></label><label>Calculate on <input id="on" type="date"></label><div class="tool-actions"><button id="go">Calculate Age</button></div><pre id="out">Your age will appear here.</pre></div></section></main><script>on.value=new Date().toISOString().slice(0,10);go.onclick=()=>{if(!dob.value||!on.value)return out.textContent='Choose both dates.';const a=new Date(dob.value+'T00:00:00'),b=new Date(on.value+'T00:00:00');if(b<a)return out.textContent='The calculation date must be after the birth date.';let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate()}if(m<0){y--;m+=12}out.textContent=y+' years, '+m+' months, '+d+' days'}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
