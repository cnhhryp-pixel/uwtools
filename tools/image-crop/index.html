<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Crop Tool Online | UWTools</title><meta name="description" content="Crop an image by pixel coordinates and dimensions directly in your browser."><link rel="canonical" href="https://uwtools.com/tools/image-crop/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/image-tools/">Images</a><a href="/developer-tools/">Developer</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Image Tools</div><h1>Image Crop</h1><p>Crop an image with exact X, Y, width and height values.</p><div class="card tool-panel"><input id="file" type="file" accept="image/*"><div class="inline-fields"><input id="x" type="number" min="0" value="0" placeholder="X"><input id="y" type="number" min="0" value="0" placeholder="Y"></div><div class="inline-fields"><input id="w" type="number" min="1" placeholder="Width"><input id="h" type="number" min="1" placeholder="Height"></div><div class="tool-actions"><button id="go">Crop & Download</button></div><p id="status">Choose an image.</p></div></section></main><script>let img=new Image();file.onchange=e=>{const f=e.target.files[0];if(!f)return;img.onload=()=>{w.value=img.width;h.value=img.height;status.textContent=img.width+' × '+img.height+' px'};img.src=URL.createObjectURL(f)};go.onclick=()=>{if(!img.src)return status.textContent='Choose an image first.';const X=+x.value,Y=+y.value,W=+w.value,H=+h.value;if(!(W>0&&H>0))return status.textContent='Enter valid crop dimensions.';const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(img,X,Y,W,H,0,0,W,H);c.toBlob(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='cropped.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)},'image/png')}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
