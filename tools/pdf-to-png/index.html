<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF to PNG Converter Online | UWTools</title><meta name="description" content="Convert PDF pages into PNG images locally in your browser and download them as a ZIP file."><link rel="canonical" href="https://uwtools.com/tools/pdf-to-png/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/pdf-tools/">PDF Tools</a><a href="/image-tools/">Image Tools</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">PDF Tools</div><h1>PDF to PNG</h1><p>Render every PDF page as a high-quality PNG image.</p><div class="card tool-panel"><input id="file" type="file" accept="application/pdf"><button id="go">Convert to PNG</button><p id="status">Choose a PDF to begin.</p></div></section></main><script type="module">import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';const file=document.getElementById('file'),go=document.getElementById('go'),status=document.getElementById('status');go.onclick=async()=>{const f=file.files[0];if(!f)return status.textContent='Choose a PDF first.';try{status.textContent='Loading PDF…';const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,zip=new JSZip();for(let i=1;i<=pdf.numPages;i++){status.textContent='Rendering page '+i+' of '+pdf.numPages+'…';const p=await pdf.getPage(i),vp=p.getViewport({scale:2}),c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;const blob=await new Promise(r=>c.toBlob(r,'image/png'));zip.file('page-'+i+'.png',blob)}status.textContent='Building ZIP…';const out=await zip.generateAsync({type:'blob'}),u=URL.createObjectURL(out),a=document.createElement('a');a.href=u;a.download='pdf-pages-png.zip';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);status.textContent='Done.'}catch(e){status.textContent='Could not convert this PDF: '+e.message}}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
