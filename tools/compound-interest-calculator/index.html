<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compound Interest Calculator | UWTools</title><meta name="description" content="Calculate compound growth from principal, rate, time and compounding frequency."><link rel="canonical" href="https://uwtools.com/tools/compound-interest-calculator/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/developer-tools/">Developer</a><a href="/image-tools/">Images</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Calculator Tools</div><h1>Compound Interest Calculator</h1><p>Estimate investment or savings growth with compounding.</p><div class="card tool-panel"><input id="p" type="number" min="0" step="0.01" placeholder="Starting principal"><input id="rate" type="number" step="0.01" placeholder="Annual interest rate %"><input id="years" type="number" min="0" step="0.1" placeholder="Years"><select id="freq"><option value="1">Yearly</option><option value="4">Quarterly</option><option value="12" selected>Monthly</option><option value="365">Daily</option></select><div class="tool-actions"><button id="go">Calculate Growth</button></div><pre id="out">Result will appear here.</pre></div></section></main><script>go.onclick=()=>{const P=+p.value,r=+rate.value/100,t=+years.value,n=+freq.value;if(!(P>=0&&Number.isFinite(r)&&t>=0))return out.textContent='Enter valid values.';const A=P*Math.pow(1+r/n,n*t);out.textContent='Final amount: '+A.toFixed(2)+'\nInterest earned: '+(A-P).toFixed(2)}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
