<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rotate Image Online | UWTools</title><meta name="description" content="Rotate JPG, PNG or WebP images by 90, 180 or 270 degrees."><link rel="canonical" href="https://uwtools.com/tools/image-rotate/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/image-tools/">Images</a><a href="/developer-tools/">Developer</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Image Tools</div><h1>Rotate Image</h1><p>Rotate an image locally and download the result.</p><div class="card tool-panel"><input id="file" type="file" accept="image/*"><select id="angle"><option value="90">90° clockwise</option><option value="180">180°</option><option value="270">270° clockwise</option></select><div class="tool-actions"><button id="go">Rotate & Download</button></div><p id="status">Choose an image.</p></div></section></main><script>let img=new Image();file.onchange=e=>{const f=e.target.files[0];if(!f)return;img.onload=()=>status.textContent=img.width+' × '+img.height+' px';img.src=URL.createObjectURL(f)};go.onclick=()=>{if(!img.src)return status.textContent='Choose an image first.';const a=+angle.value*Math.PI/180,c=document.createElement('canvas'),swap=+angle.value%180!==0;c.width=swap?img.height:img.width;c.height=swap?img.width:img.height;const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(a);x.drawImage(img,-img.width/2,-img.height/2);c.toBlob(b=>{const u=URL.createObjectURL(b),d=document.createElement('a');d.href=u;d.download='rotated.png';d.click();setTimeout(()=>URL.revokeObjectURL(u),1000)},'image/png')}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
