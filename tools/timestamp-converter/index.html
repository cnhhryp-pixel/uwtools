<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unix Timestamp Converter — UWTools</title><meta name="description" content="Convert Unix timestamps to dates and dates to Unix time."><link rel="stylesheet" href="/assets/style.css"><style>.tool{max-width:900px;margin:55px auto;padding:0 24px}.tool h1{font-size:40px;margin-bottom:8px}.tool>p{color:#667085}.editor{width:100%;min-height:280px;padding:16px;border:1px solid #d7dce5;border-radius:14px;font:15px/1.5 ui-monospace,monospace}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.actions button,.primary{border:0;border-radius:9px;padding:11px 15px;font-weight:650;cursor:pointer}.primary{background:#2563eb!important;color:#fff}.field{padding:11px;border:1px solid #d7dce5;border-radius:9px;margin:8px;max-width:230px}.result{margin:18px 0;padding:18px;border-radius:12px;background:#f8fafc;word-break:break-all;font:16px ui-monospace,monospace;min-height:54px}.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}.stats b{background:#f8fafc;padding:10px 14px;border-radius:9px}.calcrow{display:flex;flex-wrap:wrap;align-items:center;gap:5px}</style></head><body><header><a class="brand" href="/">UW<span>Tools</span></a><nav><a href="/">All Tools</a></nav></header><main class="tool"><h1>Unix Timestamp Converter</h1><p>Convert Unix timestamps to dates and dates to Unix time.</p><label>Unix timestamp</label><input id="ts" class="field" placeholder="e.g. 1760000000"><div class="actions"><button class="primary" onclick="fromTs()">Convert to date</button><button onclick="now()">Use current time</button></div><div id="out" class="result"></div><label>Date & time</label><input id="dt" class="field" type="datetime-local"><div class="actions"><button onclick="toTs()">Convert to Unix</button></div></main><footer>© 2026 UWTools</footer><script>function fromTs(){let x=Number(ts.value);if(String(Math.trunc(x)).length<=10)x*=1000;let d=new Date(x);out.textContent=isNaN(d)?'Invalid timestamp':d.toISOString()}function now(){ts.value=Math.floor(Date.now()/1000);fromTs()}function toTs(){out.textContent=dt.value?Math.floor(new Date(dt.value).getTime()/1000):"Select a date"}</script></body></html>
