<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Diff Checker Online | UWTools</title><meta name="description" content="Compare two text blocks line by line directly in your browser."><link rel="canonical" href="https://uwtools.com/tools/text-diff/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/developer-tools/">Developer</a><a href="/text-tools/">Text</a><a href="/calculator-tools/">Calculators</a><a href="/image-tools/">Images</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Text Tools</div><h1>Text Diff Checker</h1><p>Compare two versions of text and highlight changed lines.</p><div class="card tool-panel"><div class="inline-fields"><textarea id="a" rows="10" placeholder="Original text"></textarea><textarea id="b" rows="10" placeholder="Changed text"></textarea></div><div class="tool-actions"><button id="go">Compare Text</button></div><pre id="out">Differences will appear here.</pre></div></section></main><script>go.onclick=()=>{const A=a.value.split(/\r?\n/),B=b.value.split(/\r?\n/),n=Math.max(A.length,B.length),r=[];for(let i=0;i<n;i++){const x=A[i]??'',y=B[i]??'';if(x===y)r.push('  '+x);else{if(x)r.push('- '+x);if(y)r.push('+ '+y)}}out.textContent=r.join('\n')||'No differences.'}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
