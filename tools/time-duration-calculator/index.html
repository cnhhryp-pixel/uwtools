<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time Duration Calculator | UWTools</title><meta name="description" content="Calculate elapsed time between two clock times."><link rel="canonical" href="https://uwtools.com/tools/time-duration-calculator/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/developer-tools/">Developer</a><a href="/image-tools/">Images</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Calculator Tools</div><h1>Time Duration Calculator</h1><p>Find the hours and minutes between two times.</p><div class="card tool-panel"><div class="inline-fields"><label>Start time <input id="start" type="time"></label><label>End time <input id="end" type="time"></label></div><label class="check"><input id="next" type="checkbox"> End time is next day</label><div class="tool-actions"><button id="go">Calculate Duration</button></div><pre id="out">Duration will appear here.</pre></div></section></main><script>go.onclick=()=>{if(!start.value||!end.value)return out.textContent='Choose start and end times.';const m=s=>{const [h,x]=s.split(':').map(Number);return h*60+x};let a=m(start.value),b=m(end.value);if(next.checked||b<a)b+=1440;const d=b-a;out.textContent=Math.floor(d/60)+' hours, '+(d%60)+' minutes\nTotal minutes: '+d}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
