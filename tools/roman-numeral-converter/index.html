<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roman Numeral Converter | UWTools</title><meta name="description" content="Convert numbers to Roman numerals and Roman numerals back to numbers."><link rel="canonical" href="https://uwtools.com/tools/roman-numeral-converter/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/developer-tools/">Developer</a><a href="/converter-tools/">Converters</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Converter Tools</div><h1>Roman Numeral Converter</h1><p>Convert between Arabic numbers and Roman numerals.</p><div class="card tool-panel"><input id="src" type="text" placeholder="Enter 2026 or MMXXVI"><div class="tool-actions"><button id="go">Convert</button></div><pre id="out">Result will appear here.</pre></div></section></main><script>const pairs=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];function toRoman(n){if(n<1||n>3999)throw Error('Use a number from 1 to 3999');let s='';for(const [v,r] of pairs)while(n>=v){s+=r;n-=v}return s}function fromRoman(s){s=s.toUpperCase();let total=0,i=0;for(const [v,r] of pairs){while(s.slice(i,i+r.length)===r){total+=v;i+=r.length}}if(i!==s.length||toRoman(total)!==s)throw Error('Invalid Roman numeral');return total}go.onclick=()=>{try{const v=src.value.trim();out.textContent=/^\d+$/.test(v)?toRoman(+v):String(fromRoman(v))}catch(e){out.textContent='Error: '+e.message}}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
