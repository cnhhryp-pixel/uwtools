<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Line Sorter — UWTools</title><meta name="description" content="Sort text lines alphabetically or reverse their order."><link rel="stylesheet" href="/assets/style.css"><style>.tool{max-width:900px;margin:55px auto;padding:0 24px}.tool h1{font-size:40px;margin-bottom:8px}.tool>p{color:#667085}.editor{width:100%;min-height:210px;padding:16px;border:1px solid #d7dce5;border-radius:14px;font:15px/1.5 ui-monospace,monospace}.field{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:9px;margin:6px 0}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.actions button{border:0;border-radius:9px;padding:11px 15px;font-weight:650;cursor:pointer}.primary{background:#2563eb!important;color:#fff}.result{margin:15px 0;padding:17px;background:#f8fafc;border-radius:12px;word-break:break-word}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="/">UW<span>Tools</span></a><nav><a href="/">All Tools</a></nav></header><main class="tool"><h1>Line Sorter</h1><p>Sort text lines alphabetically or reverse their order.</p><textarea id="v" class="editor" placeholder="One item per line…"></textarea><div class="actions"><button class="primary" onclick="sort(1)">A → Z</button><button onclick="sort(-1)">Z → A</button></div></main><footer>© 2026 UWTools</footer><script>function sort(d){v.value=v.value.split("\n").sort((a,b)=>a.localeCompare(b)*d).join("\n")}</script></body></html>
