<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Brightness & Contrast | UWTools</title><meta name="description" content="Adjust image brightness and contrast locally in your browser."><link rel="canonical" href="https://uwtools.com/tools/image-brightness-contrast/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/developer-tools/">Developer</a><a href="/image-tools/">Images</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Image Tools</div><h1>Image Brightness & Contrast</h1><p>Adjust brightness and contrast and download the result.</p><div class="card tool-panel"><input id="file" type="file" accept="image/*"><label>Brightness <input id="bright" type="range" min="0" max="200" value="100"></label><label>Contrast <input id="contrast" type="range" min="0" max="200" value="100"></label><div class="tool-actions"><button id="go">Apply & Download</button></div><p id="status">Choose an image.</p></div></section></main><script>go.onclick=()=>{const f=file.files[0];if(!f)return status.textContent='Choose an image first.';const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.filter='brightness('+bright.value+'%) contrast('+contrast.value+'%)';x.drawImage(img,0,0);c.toBlob(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='adjusted.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);status.textContent='Done.'},'image/png')};img.src=URL.createObjectURL(f)}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
