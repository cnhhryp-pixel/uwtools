<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markup Calculator Online | UWTools</title><meta name="description" content="Calculate selling price, profit and margin from cost and markup percentage."><link rel="canonical" href="https://uwtools.com/tools/markup-calculator/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/converter-tools/">Converters</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Calculator Tools</div><h1>Markup Calculator</h1><p>Turn a cost and markup percentage into a selling price.</p><div class="card tool-panel"><input id="cost" type="number" min="0" step="0.01" value="60" placeholder="Cost"><input id="markupRate" type="number" step="0.01" value="50" placeholder="Markup %"><div class="metric-row"><div><b id="priceOut">90.00</b><span>Selling price</span></div><div><b id="profitOut">30.00</b><span>Profit</span></div><div><b id="marginOut">33.33%</b><span>Margin</span></div></div><p id="status" class="status-line">Results update instantly.</p></div></section><section><h2>Markup formula</h2><p>Selling price = cost × (1 + markup ÷ 100).</p></section></main><script>function calc(){const c=Number(cost.value),m=Number(markupRate.value);if(!(c>=0&&Number.isFinite(m))){status.textContent='Enter valid values.';return}const p=c*(1+m/100),prof=p-c;priceOut.textContent=p.toFixed(2);profitOut.textContent=prof.toFixed(2);marginOut.textContent=p!==0?(prof/p*100).toFixed(2)+'%':'0%';status.textContent='Markup calculated.'}[cost,markupRate].forEach(x=>x.oninput=calc);calc()</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
