<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV Sorter Online | UWTools</title><meta name="description" content="Sort CSV rows by any column directly in your browser."><link rel="canonical" href="https://uwtools.com/tools/csv-sorter/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/calculator-tools/">Calculators</a><a href="/developer-tools/">Developer</a><a href="/converter-tools/">Converters</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">Developer Tools</div><h1>CSV Sorter</h1><p>Sort CSV data by a selected column.</p><div class="card tool-panel"><textarea id="src" rows="10" placeholder="name,score&#10;Alex,12&#10;Ben,9"></textarea><input id="col" type="number" min="1" value="1" placeholder="Column number"><select id="dir"><option value="asc">Ascending</option><option value="desc">Descending</option></select><div class="tool-actions"><button id="go">Sort CSV</button></div><pre id="out">Sorted CSV will appear here.</pre></div></section></main><script>function parse(s){const a=[];let x='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){x+='"';i++}else q=!q}else if(c===','&&!q){a.push(x);x=''}else x+=c}a.push(x);return a}function enc(v){return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}go.onclick=()=>{const lines=src.value.trim().split(/\r?\n/).filter(Boolean);if(lines.length<2)return out.textContent='Add a header and at least one row.';const head=lines.shift(),i=Math.max(0,(+col.value||1)-1),rows=lines.map(parse);rows.sort((a,b)=>{const x=a[i]??'',y=b[i]??'',nx=Number(x),ny=Number(y),cmp=Number.isFinite(nx)&&Number.isFinite(ny)?nx-ny:x.localeCompare(y);return dir.value==='asc'?cmp:-cmp});out.textContent=[head,...rows.map(r=>r.map(enc).join(','))].join('\n')}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
