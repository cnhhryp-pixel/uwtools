<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Metadata Editor Online | UWTools</title><meta name="description" content="Edit PDF title, author, subject and keywords locally in your browser."><link rel="canonical" href="https://uwtools.com/tools/pdf-metadata-editor/"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script></head><body><header><a class="brand" href="/"><img src="/assets/logo.svg" alt="UWTools"></a><nav><a href="/pdf-tools/">PDF Tools</a><a href="/image-tools/">Image Tools</a><a href="/developer-tools/">Developer</a><a href="/">All Tools</a></nav></header><main><section class="hero"><div class="pill">PDF Tools</div><h1>PDF Metadata Editor</h1><p>Edit common PDF document properties.</p><div class="card tool-panel"><input id="file" type="file" accept="application/pdf"><input id="title" type="text" placeholder="Title"><input id="author" type="text" placeholder="Author"><input id="subject" type="text" placeholder="Subject"><input id="keywords" type="text" placeholder="Keywords, comma separated"><button id="go">Save Metadata</button><p id="status">Choose a PDF and enter the metadata you want to set.</p></div></section></main><script>document.getElementById('go').onclick=async()=>{const f=document.getElementById('file').files[0],s=document.getElementById('status');if(!f)return s.textContent='Choose a PDF first.';s.textContent='Updating metadata…';const d=await PDFLib.PDFDocument.load(await f.arrayBuffer());const v=id=>document.getElementById(id).value.trim();if(v('title'))d.setTitle(v('title'));if(v('author'))d.setAuthor(v('author'));if(v('subject'))d.setSubject(v('subject'));if(v('keywords'))d.setKeywords(v('keywords').split(',').map(x=>x.trim()).filter(Boolean));const b=await d.save(),u=URL.createObjectURL(new Blob([b],{type:'application/pdf'})),a=document.createElement('a');a.href=u;a.download='metadata-updated.pdf';a.click();URL.revokeObjectURL(u);s.textContent='Done.'}</script><footer>© 2026 UWTools · <a href="/">Browse all tools</a></footer></body></html>
